[env:esp32dev]
platform = espressif32 @ 6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = partitions_custom.csv
lib_deps =
  me-no-dev/ESPAsyncWebServer @ ^1.2.3
  me-no-dev/AsyncTCP @ ^1.1.1
  bblanchon/ArduinoJson @ ^6.21.5
build_flags =
  -D CORE_DEBUG_LEVEL=0
