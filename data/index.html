<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Icy OS Web OS</title>
  <meta name="theme-color" content="#050505">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="/style.css">
  <script src="/ui.js" defer></script>
</head>
<body>

  <!-- Login -->
  <div id="login-overlay">
    <div class="login-box">
      <div class="login-logo">Icy OS</div>
      <div class="login-sub">Web OS v1.3.1</div>
      <input type="text" id="login-user" value="admin" disabled>
      <input type="password" id="login-pass" placeholder="admin password" value="admin">
      <button id="login-btn" class="std">Connect</button>
      <p id="login-msg"></p>
    </div>
  </div>

  <!-- Desktop -->
  <div id="desktop"></div>

  <!-- Start Menu -->
  <div id="start-menu">
    <input type="text" id="menu-search" placeholder="Search apps...">
    <div class="menu-sep">System</div>
    <div class="menu-item" data-app="system"><span class="menu-icon">💻</span>System Status</div>
    <div class="menu-item" data-app="network"><span class="menu-icon">📡</span>Network</div>
    <div class="menu-item" data-app="settings"><span class="menu-icon">⚙️</span>Settings</div>
    <div class="menu-sep">Utilities</div>
    <div class="menu-item" data-app="terminal"><span class="menu-icon">💲</span>Terminal</div>
    <div class="menu-item" data-app="files"><span class="menu-icon">📁</span>File Manager</div>
    <div class="menu-item" data-app="note"><span class="menu-icon">📝</span>Notepad</div>
    <div class="menu-item" data-app="calc"><span class="menu-icon">🧮</span>Calculator</div>
    <div class="menu-item" data-app="clock"><span class="menu-icon">🕐</span>Clock</div>
    <div class="menu-item" data-app="task"><span class="menu-icon">📊</span>Task Manager</div>
    <div class="menu-item" data-app="about"><span class="menu-icon">ℹ️</span>About</div>
    <div class="menu-sep">Wireless</div>
    <div class="menu-item" data-app="wifi"><span class="menu-icon">📶</span>Wi-Fi Scanner</div>
    <div class="menu-item" data-app="attacks"><span class="menu-icon">⚡</span>Attacks</div>
    <div class="menu-item" data-app="portal"><span class="menu-icon">🚪</span>Captive Portal</div>
    <div class="menu-item" data-app="guide"><span class="menu-icon">📖</span>Guide</div>
    <div class="menu-sep">Modules</div>
    <div id="modules-menu"></div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <button id="start-btn">Start</button>
    <div id="task-icons"></div>
    <div id="tray">
      <span id="sd-status">SD: --</span>
      <span id="heap-status">Heap: --</span>
      <span id="stations-status">Stations: 0</span>
      <span id="sta-icon">📡</span>
      <span id="net-status">NET: --</span>
      <span id="clock">00:00:00</span>
    </div>
  </div>

</body>
</html>
